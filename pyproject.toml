[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inha-worldmodel"
version = "0.1.0"
description = "Rule-compliant action-conditioned world models for the 2026 INHA AI Challenge"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pyarrow>=13",
  "PyYAML>=6",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8"]

[project.scripts]
inha-train-flow = "inha_worldmodel.train:main"
inha-infer-flow = "inha_worldmodel.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
